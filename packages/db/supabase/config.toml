# Minimal Supabase local config. Full config generated by `supabase init`.
project_id = "careerasana"

[db]
port = 54322
major_version = 15

[api]
port = 54321
schemas = ["core", "knowledge", "audit"]   # 3-schema layout (DB v1.3, D1-rev)
extra_search_path = ["public", "core"]

[auth]
enabled = true
# JWT-based; RLS is the sole tenant-isolation boundary (handbook §3, A5).

# Career Intelligence cache and refresh functions
[functions.career-library-cache]
verify_jwt = false

[functions.career-library-refresh]
verify_jwt = true
