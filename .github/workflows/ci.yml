name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Gate 1: the contract is frozen and self-consistent, and the API matches the DB ----
  governance:
    name: Governance (contract freeze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI structural validation
        run: pnpm contract:validate
      - name: Spectral lint (conventions)
        run: pnpm contract:lint
      - name: Enum parity (API ↔ DB vocab v1.3)
        run: pnpm enum:check
      - name: Module boundaries (invariant A1)
        run: pnpm boundaries:check

  # ---- Gate 2: code quality ----
  quality:
    name: Lint · Typecheck · Unit
    runs-on: ubuntu-latest
    needs: governance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen          # types are derived from the frozen contract
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # ---- Gate 3: the running implementation obeys the contract ----
  contract-tests:
    name: Contract & Integration (vs Supabase)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase + apply migrations
        run: |
          supabase start --workdir packages/db
          supabase migration up --workdir packages/db
      - name: Contract tests (responses conform to the frozen OpenAPI)
        run: pnpm test:contract
      # Negative RLS test (Vertical-Slice DoD) runs here as part of integration.
